[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | alembic
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long (handled by Black)
    "B008",  # FastAPI Depends() in function defaults is the standard pattern
    "UP042", # StrEnum requires Python 3.11+; keep str+Enum for compatibility
    "E741",  # Ambiguous variable names (l, O, I) — legacy code, low risk
    "B905",  # zip() without strict= — not critical for internal usage
    "C408",  # dict() literal rewrite — cosmetic only
    "E402",  # Module level import not at top — conftest setup ordering
    "E711",  # SQLAlchemy ORM requires `== None` (not `is None`) for IS NULL filters
    "UP046", # Generic[T] base class pattern — used for SQLAlchemy type-safe repositories
]
exclude = [
    "alembic",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
