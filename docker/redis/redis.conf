# Custom Redis configuration

# Set the password requirement to match the env setup
requirepass redissecurepass

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Append Only File) for persisting user sessions and rate limits
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Networking
port 6379
bind 0.0.0.0

# TCP keepalive
tcp-keepalive 300
